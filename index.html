<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Дегунино Аренда | Интерактивный Реестр Квартир</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #3b82f6;
      --primary-dark: #1d4ed8;
      --primary-light: #eff6ff;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --bg: #090d16;
      --card-bg: #131c2e;
      --card-hover: #1e293b;
      --border: #223249;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --radius: 16px;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 95px;
    }

    /* Верхний стеклянный хедер */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(9, 13, 22, 0.9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 14px 18px;
    }

    .header-content {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .logo-block h1 {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-live {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.3);
      font-size: 0.7rem;
      padding: 2px 7px;
      border-radius: 9999px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
    }

    .badge-live::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      background-color: var(--success);
      border-radius: 50%;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.4); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .btn-action {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-action:hover, .btn-action:active {
      background: var(--border);
      transform: translateY(-1px);
    }

    .btn-action.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }

    .btn-action.primary:hover {
      background: var(--primary-dark);
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px 18px;
    }

    /* Статистика */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
    }

    .stat-card .label {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 500;
      margin-bottom: 4px;
    }

    .stat-card .val {
      font-size: 1.25rem;
      font-weight: 800;
      color: #fff;
    }

    /* Фильтры */
    .filters-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 22px;
      box-shadow: var(--shadow);
    }

    .filters-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
      align-items: flex-end;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .filter-group label {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .filter-group select, .filter-group input {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .filter-group select:focus, .filter-group input:focus {
      border-color: var(--primary);
    }

    /* Чипсы фильтров */
    .chips-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid rgba(255,255,255,0.06);
    }

    .chip-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 13px;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .chip-btn:hover {
      background: rgba(255,255,255,0.1);
      color: var(--text);
    }

    .chip-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
      font-weight: 600;
    }

    /* Сетка */
    .flats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 18px;
    }

    /* Карточка */
    .flat-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow);
      transition: transform 0.2s ease, border-color 0.2s ease;
      position: relative;
    }

    .flat-card:hover {
      transform: translateY(-3px);
      border-color: #3b82f6;
    }

    .flat-photo-wrapper {
      position: relative;
      height: 200px;
      width: 100%;
      background: #090d16;
      overflow: hidden;
    }

    .flat-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .flat-card:hover .flat-photo {
      transform: scale(1.04);
    }

    .badges-overlay {
      position: absolute;
      top: 10px;
      left: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      z-index: 2;
    }

    .badge-chip {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      backdrop-filter: blur(8px);
    }

    .badge-chip.score-high {
      background: rgba(16, 185, 129, 0.9);
      color: #fff;
    }

    .badge-chip.district {
      background: rgba(15, 23, 42, 0.85);
      color: #93c5fd;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    .badge-chip.no-comm {
      background: rgba(245, 158, 11, 0.95);
      color: #111;
    }

    .btn-fav {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
      color: #cbd5e1;
      transition: all 0.2s;
      z-index: 2;
    }

    .btn-fav.active {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.5);
    }

    .card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      gap: 10px;
    }

    .price-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .flat-price {
      font-size: 1.5rem;
      font-weight: 800;
      color: #ffffff;
    }

    .flat-price span {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .commission-badge {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .commission-badge.free {
      color: var(--success);
      font-weight: 700;
    }

    .flat-title {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.35;
      color: #f1f5f9;
    }

    .flat-address {
      font-size: 0.85rem;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .metro-badge-line {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(37, 99, 235, 0.12);
      border: 1px solid rgba(37, 99, 235, 0.25);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.82rem;
      color: #bfdbfe;
      font-weight: 600;
    }

    .metro-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #99cc33;
    }

    .flat-features {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 2px;
    }

    .feat-tag {
      font-size: 0.75rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #94a3b8;
      padding: 3px 8px;
      border-radius: 6px;
    }

    .flat-desc {
      font-size: 0.8rem;
      color: #94a3b8;
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-top: auto;
    }

    .card-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      background: rgba(9, 13, 22, 0.5);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .source-tag {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .btn-cian {
      background: #004ee5;
      color: #fff;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 7px 14px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .btn-cian:hover {
      background: #003bb8;
    }

    /* Модалка деталей */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(8px);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      max-width: 600px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      position: relative;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .modal-close {
      position: absolute;
      top: 18px;
      right: 18px;
      background: transparent;
      border: none;
      font-size: 1.5rem;
      color: var(--text-muted);
      cursor: pointer;
    }

    /* Нижняя мобильная панель (Bottom Navigation Bar) */
    .mobile-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(10, 16, 28, 0.96);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: stretch;
      padding: 6px 10px calc(env(safe-area-inset-bottom, 0px) + 6px);
      z-index: 150;
      box-shadow: 0 -10px 25px rgba(0,0,0,0.4);
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: #94a3b8;
      font-size: 0.72rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      background: transparent;
      border: none;
      padding: 8px 4px;
      border-radius: 12px;
      transition: all 0.2s ease;
      touch-action: manipulation;
      user-select: none;
    }

    .nav-item:active {
      transform: scale(0.94);
      background: rgba(255,255,255,0.06);
    }

    .nav-item.active {
      color: #38bdf8;
    }

    .nav-item.active svg {
      stroke: #38bdf8;
      filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.5));
    }

    .nav-item svg {
      width: 22px;
      height: 22px;
      stroke: #94a3b8;
      stroke-width: 2;
      transition: stroke 0.2s, filter 0.2s;
    }

    .nav-badge {
      background: var(--danger);
      color: #fff;
      font-size: 0.65rem;
      padding: 1px 5px;
      border-radius: 10px;
      margin-left: 2px;
      font-weight: 700;
    }

    @media (max-width: 640px) {
      .header-content {
        flex-direction: column;
        align-items: flex-start;
      }
      .header-actions {
        width: 100%;
        justify-content: space-between;
      }
      .flats-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- Шапка -->
  <header>
    <div class="header-content">
      <div class="logo-block">
        <h1>
          🏠 Дегунино Аренда
          <span class="badge-live">LIVE Циан</span>
        </h1>
      </div>
      <div class="header-actions">
        <button class="btn-action" id="btnRefresh" onclick="refreshData()">
          🔄 Обновить
        </button>
        <button class="btn-action primary" onclick="openDirectCian()">
          🔗 Открыть на Циан
        </button>
      </div>
    </div>
  </header>

  <div class="container">
    
    <!-- Сводная плашка -->
    <div class="stats-bar">
      <div class="stat-card">
        <div class="label">Найдено квартир</div>
        <div class="val" id="statCount">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Мин. цена</div>
        <div class="val" id="statMinPrice">0 ₽</div>
      </div>
      <div class="stat-card">
        <div class="label">Средняя цена</div>
        <div class="val" id="statAvgPrice">0 ₽</div>
      </div>
      <div class="stat-card">
        <div class="label">Без комиссии</div>
        <div class="val" id="statZeroComm" style="color: var(--success);">0</div>
      </div>
    </div>

    <!-- Фильтры -->
    <div class="filters-box">
      <div class="filters-grid">
        
        <div class="filter-group">
          <label>Район Дегунино:</label>
          <select id="filterDistrict" onchange="applyFilters()">
            <option value="all">Все (Западное и Восточное)</option>
            <option value="Западное Дегунино">Западное Дегунино</option>
            <option value="Восточное Дегунино">Восточное Дегунино</option>
          </select>
        </div>

        <div class="filter-group">
          <label>Макс. цена в месяц (до 70 000 ₽):</label>
          <select id="filterPrice" onchange="applyFilters()">
            <option value="70000">До 70 000 ₽</option>
            <option value="65000">До 65 000 ₽</option>
            <option value="60000">До 60 000 ₽</option>
            <option value="55000">До 55 000 ₽</option>
            <option value="50000">До 50 000 ₽</option>
            <option value="all">Любая</option>
          </select>
        </div>

        <div class="filter-group">
          <label>Пешком до метро:</label>
          <select id="filterMetroTime" onchange="applyFilters()">
            <option value="15">До 15 минут пешком</option>
            <option value="12">До 12 минут пешком</option>
            <option value="10">До 10 минут пешком</option>
            <option value="all">Без ограничений</option>
          </select>
        </div>

        <div class="filter-group">
          <label>Сортировка:</label>
          <select id="filterSort" onchange="applyFilters()">
            <option value="score">🏆 Умный рейтинг (Топ-выбор)</option>
            <option value="price_asc">💰 Сначала дешевле</option>
            <option value="metro_asc">🚶 Ближе к метро</option>
            <option value="area_desc">📐 Сначала просторные</option>
          </select>
        </div>

      </div>

      <!-- Быстрые чипсы-фильтры -->
      <div class="chips-row">
        <button class="chip-btn" id="chipZeroComm" onclick="toggleChip('zeroComm')">
          ⚡ Без комиссии (0%)
        </button>
        <button class="chip-btn active" id="chipWashing" onclick="toggleChip('washing')">
          🧺 Стиральная машина (строго)
        </button>
        <button class="chip-btn" id="chipDishwasher" onclick="toggleChip('dish')">
          🍽️ Посудомойка
        </button>
        <button class="chip-btn" id="chipEuro" onclick="toggleChip('euro')">
          ✨ Евро / Дизайнерский ремонт
        </button>
        <button class="chip-btn" id="chipFavs" onclick="toggleChip('favs')">
          ❤️ Только избранное (<span id="favCount">0</span>)
        </button>
      </div>

    </div>

    <!-- Сетка предложений -->
    <div class="flats-grid" id="flatsGrid">
      <!-- Генерируется динамически -->
    </div>

  </div>

  <!-- Надежная нижняя мобильная навигация -->
  <nav class="mobile-nav" id="bottomNav">
    <button class="nav-item active" id="navAll" onclick="navSwitch('all')">
      <svg fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      <span>Все квартиры</span>
    </button>
    <button class="nav-item" id="navTop" onclick="navSwitch('top')">
      <svg fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/></svg>
      <span>Топ-варианты</span>
    </button>
    <button class="nav-item" id="navFav" onclick="navSwitch('fav')">
      <svg fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
      <span>Избранное <b class="nav-badge" id="navFavBadge" style="display: none;">0</b></span>
    </button>
    <button class="nav-item" id="navCian" onclick="openDirectCian()">
      <svg fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
      <span>Циан Поиск</span>
    </button>
  </nav>

  <!-- Модальное окно детализации -->
  <div class="modal-overlay" id="flatModal" onclick="closeModal(event)">
    <div class="modal-box" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script>
    // Резервная копия на случай оффлайн-работы
    window.BACKUP_FLATS = [
      {
        "id": "cian-3101",
        "title": "1-комн. квартира, 38 м², 5/14 эт.",
        "district": "Восточное Дегунино",
        "address": "Керамический проезд, 45к2",
        "price": 45000,
        "deposit": 45000,
        "commission": 50,
        "area": 38.0,
        "floor": "5/14",
        "metro": "Дегунино (МЦД-1)",
        "metro_time": 9,
        "metro_type": "пешком",
        "repair": "Косметический",
        "washing_machine": true,
        "dishwasher": false,

    let allFlats = [];
    let favorites = JSON.parse(localStorage.getItem('degunino_favs') || '[]');
    let currentNavTab = 'all'; // 'all', 'top', 'fav'
    let activeChips = {
      zeroComm: false,
      washing: true,
      dish: false,
      euro: false,
      favs: false
    };

    // Надежное переключение разделов через нижний бар
    function navSwitch(tab) {
      currentNavTab = tab;

      // Обновляем визуальный активный класс кнопок
      document.querySelectorAll('.mobile-nav .nav-item').forEach(el => el.classList.remove('active'));
      if (tab === 'all') document.getElementById('navAll').classList.add('active');
      if (tab === 'top') document.getElementById('navTop').classList.add('active');
      if (tab === 'fav') document.getElementById('navFav').classList.add('active');

      if (tab === 'all') {
        activeChips.favs = false;
        document.getElementById('chipFavs').classList.remove('active');
        document.getElementById('filterSort').value = 'score';
        document.getElementById('filterPrice').value = '70000';
        document.getElementById('filterMetroTime').value = '15';
      } else if (tab === 'top') {
        activeChips.favs = false;
        document.getElementById('chipFavs').classList.remove('active');
        document.getElementById('filterSort').value = 'score';
        document.getElementById('filterPrice').value = '65000';
        document.getElementById('filterMetroTime').value = '12';
      } else if (tab === 'fav') {
        activeChips.favs = true;
        document.getElementById('chipFavs').classList.add('active');
      }

      applyFilters();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function loadData() {
      try {
        const res = await fetch('/api/flats');
        if (res.ok) {
          allFlats = await res.json();
        } else {
          throw new Error('API offline');
        }
      } catch (e) {
        allFlats = window.BACKUP_FLATS;
      }
      updateFavCount();
      applyFilters();
    }

    function updateFavCount() {
      const cnt = favorites.length;
      document.getElementById('favCount').textContent = cnt;
      const badge = document.getElementById('navFavBadge');
      if (cnt > 0) {
        badge.textContent = cnt;
        badge.style.display = 'inline-block';
      } else {
        badge.style.display = 'none';
      }
    }

    function toggleFavorite(id, e) {
      if (e) e.stopPropagation();
      const idx = favorites.indexOf(id);
      if (idx > -1) {
        favorites.splice(idx, 1);
      } else {
        favorites.push(id);
      }
      localStorage.setItem('degunino_favs', JSON.stringify(favorites));
      updateFavCount();
      applyFilters();
    }

    function toggleChip(chipName) {
      activeChips[chipName] = !activeChips[chipName];
      const el = document.getElementById('chip' + chipName.charAt(0).toUpperCase() + chipName.slice(1));
      if (el) {
        el.classList.toggle('active', activeChips[chipName]);
      }
      if (chipName === 'favs') {
        currentNavTab = activeChips.favs ? 'fav' : 'all';
        document.querySelectorAll('.mobile-nav .nav-item').forEach(btn => btn.classList.remove('active'));
        if (activeChips.favs) {
          document.getElementById('navFav').classList.add('active');
        } else {
          document.getElementById('navAll').classList.add('active');
        }
      }
      applyFilters();
    }

    function openDirectCian() {
      const url = "https://www.cian.ru/cat.php?deal_type=rent&engine_version=2&offer_type=flat&room1=1&rayon[0]=337&rayon[1]=357&maxprice=70000&foot_min=15&only_foot=2";
      window.open(url, '_blank');
    }

    async function refreshData() {
      const btn = document.getElementById('btnRefresh');
      btn.textContent = '⏳ Загрузка...';
      try {
        const res = await fetch('/api/refresh', { method: 'POST' });
        if (res.ok) {
          const data = await res.json();
          allFlats = data.flats || allFlats;
        }
      } catch (err) {
        console.error(err);
      }
      btn.textContent = '🔄 Обновить';
      applyFilters();
    }

    function applyFilters() {
      const district = document.getElementById('filterDistrict').value;
      const maxPrice = document.getElementById('filterPrice').value;
      const maxMetroTime = document.getElementById('filterMetroTime').value;
      const sort = document.getElementById('filterSort').value;

      let filtered = allFlats.filter(f => {
        if (district !== 'all' && f.district !== district) return false;
        if (maxPrice !== 'all' && f.price > parseInt(maxPrice)) return false;
        if (maxMetroTime !== 'all' && f.metro_time > parseInt(maxMetroTime)) return false;

        if (activeChips.zeroComm && f.commission > 0) return false;
        if (activeChips.washing && !f.washing_machine) return false;
        if (activeChips.dish && !f.dishwasher) return false;
        if (activeChips.euro && !f.repair.toLowerCase().includes('евро') && !f.repair.toLowerCase().includes('дизайн')) return false;
        if (activeChips.favs && !favorites.includes(f.id)) return false;

        return true;
      });

      if (sort === 'score') {
        filtered.sort((a, b) => (b.score || 0) - (a.score || 0));
      } else if (sort === 'price_asc') {
        filtered.sort((a, b) => a.price - b.price);
      } else if (sort === 'metro_asc') {
        filtered.sort((a, b) => a.metro_time - b.metro_time);
      } else if (sort === 'area_desc') {
        filtered.sort((a, b) => b.area - a.area);
      }

      renderStats(filtered);
      renderGrid(filtered);
    }

    function renderStats(list) {
      document.getElementById('statCount').textContent = list.length;
      if (list.length === 0) {
        document.getElementById('statMinPrice').textContent = '—';
        document.getElementById('statAvgPrice').textContent = '—';
        document.getElementById('statZeroComm').textContent = '0';
        return;
      }
      const prices = list.map(f => f.price);
      const min = Math.min(...prices);
      const avg = Math.round(prices.reduce((a, b) => a + b, 0) / list.length);
      const zeroComm = list.filter(f => f.commission === 0).length;

      document.getElementById('statMinPrice').textContent = min.toLocaleString('ru-RU') + ' ₽';
      document.getElementById('statAvgPrice').textContent = avg.toLocaleString('ru-RU') + ' ₽';
      document.getElementById('statZeroComm').textContent = zeroComm;
    }

    function renderGrid(list) {
      const grid = document.getElementById('flatsGrid');
      if (list.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; padding: 50px 20px; color: var(--text-muted); background: var(--card-bg); border-radius: var(--radius); border: 1px dashed var(--border);">
            <div style="font-size: 2.5rem; margin-bottom: 12px;">${activeChips.favs ? '❤️' : '🔍'}</div>
            <h3 style="color: #fff; margin-bottom: 6px;">${activeChips.favs ? 'В избранном пока нет квартир' : 'По заданным фильтрам ничего не найдено'}</h3>
            <p>${activeChips.favs ? 'Нажимайте на сердечко на любой карточке, чтобы добавить её в этот список.' : 'Попробуйте смягчить фильтры по цене или времени до метро.'}</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = list.map(f => {
        const isFav = favorites.includes(f.id);
        const commText = f.commission === 0 ? 'Без комиссии (0%)' : `Комиссия ${f.commission}%`;
        const commClass = f.commission === 0 ? 'free' : '';
        const scoreBadge = f.score >= 85 ? `<div class="badge-chip score-high">★ Топ (${f.score}/100)</div>` : '';

        return `
          <div class="flat-card" onclick="openDetails('${f.id}')">
            <div class="flat-photo-wrapper">
              <img class="flat-photo" src="${f.photo}" alt="${f.title}" loading="lazy">
              <div class="badges-overlay">
                ${scoreBadge}
                <div class="badge-chip district">${f.district}</div>
                ${f.commission === 0 ? '<div class="badge-chip no-comm">0% Комиссия</div>' : ''}
              </div>
              <button class="btn-fav ${isFav ? 'active' : ''}" title="В избранное" onclick="toggleFavorite('${f.id}', event)">
                ${isFav ? '❤️' : '🤍'}
              </button>
            </div>

            <div class="card-body">
              <div class="price-row">
                <div class="flat-price">${f.price.toLocaleString('ru-RU')} <span>₽/мес</span></div>
                <div class="commission-badge ${commClass}">${commText}</div>
              </div>

              <div class="flat-title">${f.title}</div>
              <div class="flat-address">📍 ${f.address}</div>

              <div class="metro-badge-line">
                <span class="metro-dot"></span>
                <span>${f.metro}</span>
                <span style="color: #60a5fa; margin-left: auto;">🚶 ${f.metro_time} мин</span>
              </div>

              <div class="flat-features">
                <span class="feat-tag">Ремонт: ${f.repair}</span>
                <span class="feat-tag">🧺 Стиралка</span>
                ${f.dishwasher ? '<span class="feat-tag" style="color: #86efac;">🍽️ Посудомойка</span>' : ''}
                ${f.balcony ? '<span class="feat-tag">Балкон</span>' : ''}
              </div>

              <div class="flat-desc">${f.description}</div>
            </div>

            <div class="card-footer">
              <span class="source-tag">Источник: ${f.source}</span>
              <a href="${f.url}" target="_blank" rel="noopener" class="btn-cian" onclick="event.stopPropagation()">
                На Циан ↗
              </a>
            </div>
          </div>
        `;
      }).join('');
    }

    function openDetails(id) {
      const f = allFlats.find(item => item.id === id);
      if (!f) return;

      const modal = document.getElementById('flatModal');
      const content = document.getElementById('modalContent');
      const isFav = favorites.includes(f.id);

      content.innerHTML = `
        <div style="border-radius: 12px; overflow: hidden; margin-bottom: 16px; height: 260px;">
          <img src="${f.photo}" style="width: 100%; height: 100%; object-fit: cover;">
        </div>
        <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px;">
          <h2 style="font-size: 1.6rem; color: #fff;">${f.price.toLocaleString('ru-RU')} ₽ <span style="font-size: 1rem; color: var(--text-muted); font-weight: 500;">/ месяц</span></h2>
          <span style="font-size: 0.9rem; font-weight: 700; color: ${f.commission === 0 ? 'var(--success)' : 'var(--text-muted)'};">
            ${f.commission === 0 ? 'Без комиссии' : `Комиссия ${f.commission}%`}
          </span>
        </div>
        <h3 style="font-size: 1.15rem; margin-bottom: 8px;">${f.title}</h3>
        <p style="color: #cbd5e1; margin-bottom: 14px;">📍 ${f.district}, ${f.address}</p>

        <div style="background: rgba(37,99,235,0.12); padding: 12px; border-radius: 10px; margin-bottom: 16px; border: 1px solid rgba(37,99,235,0.3);">
          <div style="display: flex; align-items: center; justify-content: space-between;">
            <div style="display: flex; align-items: center; gap: 8px;">
              <span class="metro-dot"></span>
              <strong>${f.metro}</strong>
            </div>
            <span style="color: #93c5fd; font-weight: 700;">🚶 ${f.metro_time} мин пешком</span>
          </div>
        </div>

        <div style="margin-bottom: 16px; line-height: 1.6; color: #cbd5e1;">
          <h4 style="color: #fff; margin-bottom: 6px;">Описание:</h4>
          ${f.description}
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; font-size: 0.85rem; color: var(--text-muted);">
          <div>Ремонт: <strong style="color: #fff;">${f.repair}</strong></div>
          <div>Этаж: <strong style="color: #fff;">${f.floor}</strong></div>
          <div>Площадь: <strong style="color: #fff;">${f.area} м²</strong></div>
          <div>Залог: <strong style="color: #fff;">${f.deposit.toLocaleString('ru-RU')} ₽</strong></div>
          <div>Стиральная машина: <strong style="color: #86efac;">Есть</strong></div>
          <div>Посудомоечная: <strong style="color: ${f.dishwasher ? '#86efac' : '#cbd5e1'};">${f.dishwasher ? 'Есть' : 'Нет'}</strong></div>
        </div>

        <div style="display: flex; gap: 10px;">
          <a href="${f.url}" target="_blank" rel="noopener" style="flex: 1; text-align: center; text-decoration: none;" class="btn-action primary">
            Открыть на Циан ↗
          </a>
          <button class="btn-action" onclick="toggleFavorite('${f.id}'); openDetails('${f.id}');">
            ${isFav ? '❤️ В избранном' : '🤍 Добавить'}
          </button>
        </div>
      `;
      modal.classList.add('open');
    }

    function closeModal(e) {
      document.getElementById('flatModal').classList.remove('open');
    }

    window.onload = loadData;
  </script>
</body>
</html>

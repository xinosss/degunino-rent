name: Check Cian Flats and Notify Telegram

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  check_and_notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Check flats and notify
        env:
          TELEGRAM_TOKEN: "9271631223:AAGaJ8w9kbFIdaT8G3rMgMMdvD5tdlFQaLA"
        run: |
          python -c "
          import requests
          import os
          import json

          token = os.environ.get('TELEGRAM_TOKEN')

          # Запрашиваем все входящие обновления (сообщения) боту за все время
          res = requests.get(f'https://api.telegram.org/bot{token}/getUpdates?offset=-10').json()
          print('Updates raw response:', json.dumps(res, ensure_ascii=False))

          chat_ids = set()
          if 'result' in res:
              for item in res['result']:
                  # Ищем чат в любых типах событий (message, callback_query, my_chat_member)
                  msg = item.get('message') or item.get('callback_query', {}).get('message') or item.get('my_chat_member')
                  if msg and 'chat' in msg:
                      chat_ids.add(msg['chat']['id'])
                  elif 'channel_post' in item:
                      chat_ids.add(item['channel_post']['chat']['id'])

          print(f'Detected chat IDs: {chat_ids}')

          if not chat_ids:
              print('No chat IDs detected yet.')
              exit(0)

          # Загружаем квартиры
          with open('flats_data.json', 'r', encoding='utf-8') as f:
              flats = json.load(f)

          flats.sort(key=lambda x: x.get('score', 0), reverse=True)
          top = flats[0] if flats else None

          for cid in chat_ids:
              text = (
                  '🏠 *Реестр квартир Дегунино (Циан) подключен!*\n\n'
                  'Вы успешно получаете уведомления по вашим критериям:\n'
                  '• 1-комн. квартиры до 70 000 ₽/мес\n'
                  '• Пешком до метро ≤ 15 минут\n'
                  '• Со стиральной машиной\n\n'
                  f'🌟 *Лучший вариант сейчас:*\n'
                  f'*{top[\"title\"]}* — *{top[\"price\"]:,} ₽/мес*\n'
                  f'📍 {top[\"address\"]} (м. {top[\"metro\"]}, 🚶 {top[\"metro_time\"]} мин)\n'
                  f'💰 {\"0% Без комиссии\" if top[\"commission\"] == 0 else f\"Комиссия {top[\"commission\"]}%\ draft\"}\n\n'
                  '📱 *Интерактивный реестр квартир:*\nhttps://xinosss.github.io/degunino-rent/'
              )
              payload = {
                  'chat_id': cid,
                  'text': text,
                  'parse_mode': 'Markdown',
                  'reply_markup': {
                      'inline_keyboard': [
                          [{'text': '🌐 Открыть Реестр', 'url': 'https://xinosss.github.io/degunino-rent/'}],
                          [{'text': '🔗 Открыть на Циан', 'url': top['url']}]
                      ]
                  }
              }
              r = requests.post(f'https://api.telegram.org/bot{token}/sendMessage', json=payload)
              print(f'Sent to {cid}: {r.status_code} {r.text}')
          "

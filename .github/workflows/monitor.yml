name: Check Cian Flats and Notify Telegram

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  check_and_notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run cloud notifier
        env:
          TELEGRAM_TOKEN: "9271631223:AAGaJ8w9kbFIdaT8G3rMgMMdvD5tdlFQaLA"
        run: python cloud_notifier.py
